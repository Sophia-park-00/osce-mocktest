<!DOCTYPE html>
<html lang="ko-KR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임상수기 MOCK Test - 구강내과</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Malgun Gothic','맑은 고딕',sans-serif; background:#0f1729; color:#e8edf5; line-height:1.6; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
           background:#16223d; padding:14px 18px; border-radius:12px; margin-bottom:14px; }
  header h1 { font-size:18px; color:#7fb4ff; }
  .badge { font-size:12px; background:#2f6fc0; padding:3px 10px; border-radius:20px; margin-left:8px; }
  .timer { font-size:26px; font-weight:bold; font-variant-numeric:tabular-nums; padding:6px 16px;
           border-radius:10px; background:#1f3a5c; }
  .timer.warn { background:#5c2a2a; color:#ff9b9b; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  @media (max-width:880px){ .grid{ grid-template-columns:1fr; } }
  .card { background:#16223d; border-radius:12px; padding:16px; }
  .card h2 { font-size:15px; color:#9cc4ff; margin-bottom:10px; border-bottom:1px solid #2a3c5e; padding-bottom:6px; }
  .info-row { font-size:14px; margin-bottom:4px; }
  .info-row b { color:#ffd479; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td,th { border:1px solid #2a3c5e; padding:5px 7px; text-align:left; }
  th { background:#1f3a5c; }
  #chat { height:340px; overflow-y:auto; background:#0c1426; border-radius:10px; padding:12px; margin-bottom:10px; }
  .msg { margin-bottom:10px; display:flex; }
  .msg .b { padding:8px 12px; border-radius:12px; max-width:80%; font-size:14px; }
  .msg.s { justify-content:flex-end; }
  .msg.s .b { background:#1f4a7a; }
  .msg.p .b { background:#243355; }
  .msg.sys .b { background:#3a2f1a; color:#ffd479; font-size:13px; max-width:100%; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text]{ flex:1; min-width:160px; padding:10px; border-radius:8px; border:1px solid #2a3c5e; background:#0c1426; color:#fff; font-size:14px; }
  button { padding:10px 14px; border:none; border-radius:8px; background:#2f6fc0; color:#fff; font-size:14px; cursor:pointer; }
  button:hover{ background:#3a82da; }
  button.mic { background:#c0392b; }
  button.mic.on { background:#e74c3c; animation:pulse 1s infinite; }
  button.sec { background:#3a4a66; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.6;} }
  .stage { display:none; }
  .stage.active { display:block; }
  .stage-tabs { display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
  .stage-tabs button { background:#243355; font-size:13px; }
  .stage-tabs button.cur { background:#2f6fc0; }
  .stage-tabs button.hidden { display:none; }
  .score-box { font-size:15px; }
  .score-big { font-size:40px; font-weight:bold; color:#7fb4ff; }
  textarea { width:100%; min-height:70px; padding:10px; border-radius:8px; border:1px solid #2a3c5e; background:#0c1426; color:#fff; font-size:14px; }
  label.fld { display:block; font-size:13px; color:#9cc4ff; margin:8px 0 3px; }
  .chk { display:flex; align-items:center; gap:8px; padding:3px 0; font-size:13px; }
  .chk .dot { width:16px; height:16px; border-radius:50%; background:#444; flex-shrink:0; text-align:center; font-size:11px; line-height:16px; }
  .chk .dot.ok { background:#27ae60; }
  .askcount { font-size:13px; color:#8aa0c0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🦷 임상수기 MOCK Test · 구강내과 <span class="badge" id="caseType"></span></h1>
    <div class="timer" id="timer">10:00</div>
  </header>

  <div class="stage-tabs">
    <button id="tab0" class="cur" onclick="goStage(0)">① 검사기록</button>
    <button id="tab1" onclick="goStage(1)">② 문진</button>
    <button id="tab2" onclick="goStage(2)">③ 진단·치료계획</button>
    <button id="tab3" onclick="goStage(3)">④ 수기</button>
    <button id="tab4" onclick="goStage(4)">⑤ 채점</button>
    <button class="sec" onclick="restart()">🔄 새 문제(셔플)</button>
  </div>

  <!-- STAGE 0 -->
  <div class="stage active" id="stage0">
    <div class="grid">
      <div class="card">
        <h2>환자 정보 / 주소(C.C)</h2>
        <div class="info-row"><b>환자:</b> <span id="ptName"></span></div>
        <div class="info-row"><b>주소:</b> <span id="ptCC"></span></div>
        <p class="askcount" id="caseGuide" style="margin-top:8px;"></p>
      </div>
      <div class="card">
        <h2 id="examTitle">검사 소견</h2>
        <table id="examTable"></table>
      </div>
    </div>
    <div style="margin-top:14px; text-align:center;">
      <button onclick="goStage(1)">확인 완료 → 문진 시작 ▶</button>
    </div>
  </div>

  <!-- STAGE 1 -->
  <div class="stage" id="stage1">
    <div class="card">
      <h2>표준환자 문진 <span class="askcount" id="askCount"></span></h2>
      <div id="chat"></div>
      <div class="controls">
        <button class="mic" id="micBtn" onclick="toggleMic()">🎤 음성질문</button>
        <input type="text" id="qInput" placeholder="환자에게 질문하세요" onkeydown="if(event.key==='Enter')askText()">
        <button onclick="askText()">전송</button>
      </div>
      <p class="askcount" style="margin-top:6px;">필요한 항목을 스스로 떠올려 질문하세요. 무엇을 빠뜨렸는지는 채점 단계에서 확인됩니다.</p>
    </div>
    <div style="margin-top:14px; text-align:center;">
      <button onclick="goStage(2)">문진 종료 → 진단·치료계획 ▶</button>
    </div>
  </div>

  <!-- STAGE 2 -->
  <div class="stage" id="stage2">
    <div class="card">
      <h2>진단 및 치료계획 작성</h2>
      <label class="fld">최종 진단명</label>
      <textarea id="dxInput"></textarea>
      <label class="fld">치료계획</label>
      <textarea id="txInput"></textarea>
      <div style="margin-top:12px; text-align:center;">
        <button id="dxNext" onclick="afterDx()">저장 ▶</button>
      </div>
    </div>
  </div>

  <!-- STAGE 3 -->
  <div class="stage" id="stage3">
    <div class="card">
      <h2>직접 술기 (자가 체크)</h2>
      <p class="askcount">수행한 술기 단계를 체크하세요.</p>
      <div id="skillList" style="margin-top:10px;"></div>
      <div style="margin-top:12px; text-align:center;">
        <button onclick="goStage(4)">채점 결과 보기 ▶</button>
      </div>
    </div>
  </div>

  <!-- STAGE 4 -->
  <div class="stage" id="stage4">
    <div class="grid">
      <div class="card">
        <h2>채점 결과</h2>
        <div class="score-box">
          <div>총점 <span class="score-big" id="totalScore">0</span> / <span id="maxScore">0</span></div>
          <div id="grade" style="margin-top:6px; font-size:18px;"></div>
        </div>
      </div>
      <div class="card">
        <h2>영역별 점수</h2>
        <table id="sectionTable"></table>
      </div>
    </div>
    <div class="card" style="margin-top:14px;">
      <h2>문진 항목 결과</h2>
      <div id="hxResult" style="font-size:13px;"></div>
    </div>
    <div class="card" style="margin-top:14px;">
      <h2>상세 피드백 (놓친 항목)</h2>
      <div id="feedback" style="font-size:13px;"></div>
    </div>
    <div style="margin-top:14px; text-align:center;">
      <button onclick="restart()">🔄 새 문제로 다시 시작</button>
    </div>
  </div>
</div>

<script>
/* ===== 공통 문진 항목 키워드 (모든 케이스 공유, 답변만 케이스별) ===== */
const KW = {
  cc:["어디","무슨","어떻게 오셨","불편","증상","어떤 일","왜 오","주소","어디가 아","어떤 증상"],
  onset:["언제부터","언제","처음","시작","된 지","얼마나 됐","발생","며칠","오래"],
  trigger:["계기","왜 생","원인","이유","무슨 일","어떤 일 있","유발","때문"],
  quality:["어떻게 아","어떤 느낌","양상","쑤시","지끈","욱신","조이","느낌","찌르","둔한","묵직","따끔","쓰리"],
  intensity:["얼마나 아","강도","점수","몇 점","심하","vas","nrs","정도로 아","통증 정도"],
  course:["자주","빈도","얼마나 자주","변화","매일","계속","좋아졌","나빠졌","주기","몇 번","재발","흉터","낫는","아무는"],
  history:["예전에","과거","전에도","치료받","검사받","병원","mri","이런 적","처음이","받아본","과거력"],
  agg:["악화","심해","나빠","더 아","완화","나아","줄어","좋아","쉬면","누르면","찜질","언제 더","씹을 때","먹을 때"],
  psych:["스트레스","수면","잠","흡연","담배","음주","술","생활","직장","피곤","피로"],
  pmh:["전신","지병","기저","앓","당뇨","고혈압","복용","약 드시","병 있","건강","전신질환"],
  pdh:["치과","스케일링","발치","신경치료","임플란트","틀니","치료 경험","이 치료","마취"],
  prodrome:["전구","따끔거리기 전","물집 생기기 전","조짐","예감","간질"]
};
const LABEL = {
  cc:"주소(C.C) 확인", onset:"발생 시점(Onset)", trigger:"계기/유발요인", quality:"통증(증상) 양상",
  intensity:"통증 강도(NRS/VAS)", course:"통증(증상) 변화·재발 양상", history:"과거력/치료경험",
  agg:"악화/완화 요인", psych:"사회심리 요인(스트레스·수면·흡연·음주)", pmh:"전신 병력(PMH)",
  pdh:"치과 병력(PDH)", prodrome:"전구증상 확인"
};
function Q(id,ans,score){ return {id, label:LABEL[id], kw:KW[id], ans, score:score||3}; }

/* ===================== 케이스 정의 ===================== */
const CASES = [
/* 1. 긴장성 두통 (복합) */
{
  key:"tension", type:"복합", name:"김영희 (만 42세, 여성)",
  cc:"3개월 전부터 양쪽 관자놀이가 지끈거리고 묵직하게 아파요.",
  examTitle:"임상·진단 검사 기록 (사전 제시)",
  guide:"복합문항입니다. 아래 검사 기록이 사전에 제시됩니다. 문진을 직접 진행한 뒤, 이 기록을 참고하여 진단·치료계획을 설명하고 수기를 시행하세요.",
  exam:[
    ["최대개구량(CMO/PMO)","50mm / 52mm (정상)"],
    ["측방·전방 운동","각 10mm, 통증 없음 (정상)"],

    ["하악 운동경로","편위·굴곡 없음"],
    ["파노라마·구내 방사선","치성·골 이상 없음"],
    ["뇌 MRI (신경과)","이상 없음"],
    ["측두근 촉진","양측 전연 측두근 압통(+), 평소 두통과 동일"]
  ],
  questions:[
    Q("cc","양쪽 머리 옆쪽, 관자놀이가 지끈거리고 무겁게 짓눌리듯 아파요."),
    Q("onset","한 3개월 정도 됐어요."),
    Q("trigger","회사 일로 스트레스를 많이 받으면서 시작된 것 같아요."),
    Q("quality","지끈거리고 묵직하게 머리를 짓누르는 느낌이에요."),

  treatment:{ groups:[
    {kw:["스트레스","생활","습관","안심","휴식"], label:"스트레스·생활습관 관리/안심", score:2},
    {kw:["온찜질","물리","찜질","온열"], label:"온찜질·물리치료", score:2},
    {kw:["운동","6-6-6","이완","스트레칭"], label:"근육 이완운동", score:2},
    {kw:["약","진통","소염","근이완","처방"], label:"약물치료", score:2},
    {kw:["주사","발통점","tpi"], label:"발통점 주사요법(필요시)", score:2}
  ]},
  skills:[
    {label:"위생 복장(마스크·글러브) 착용", score:2},
    {label:"'이악물기'로 전연 측두근 위치 확인", score:3},
    {label:"검지·중지(두 손가락) 사용", score:3},
    {label:"약 1kg의 수직 가압 (문지르지 않음)", score:3},
    {label:"양측 대칭으로 동시 촉진", score:3},
    {label:"평소 두통과 동일한 통증인지 재현성 확인 질문", score:3}
  ]
},
/* 2. RAS 재발성 아프타구내염 (진료) */
{
  key:"ras", type:"진료", name:"이수지 (만 24세, 여성)",
  cc:"입안이 자주 헐고 아파서 왔어요. 자주 생기니까 큰 병은 아닌지 걱정돼요.",

  exam:[
    ["시진","우측 하순 점막에 약 2mm 궤양, 황색 위막 + 주변 홍반"],
    ["촉진","압통(+), 경결감 없음"],
    ["점막 박리","문질러도 벗겨지지 않음"],
    ["림프절","종창 없음"],
    ["인접 치아","타진·치수생활력 이상 없음"],
    ["파노라마","특이 소견 없음"]
  ],
  questions:[
    Q("cc","입안이 자주 헐고 아파요. 음식 먹을 때 많이 쓰려요."),

    Q("trigger","스트레스 받거나 피곤하면 잘 생기는 것 같아요."),

    Q("pmh","특별한 지병은 없어요. (눈·외음부 궤양은 없습니다)"),
    Q("pdh","치과 치료 받다가 문제가 생긴 적은 없어요.")
  ],
  diagnosis:{ keywords:["아프타","구내염","ras","아프따"], score:8, answer:"재발성 아프타구내염 (RAS)" },
  treatment:{ groups:[
    {kw:["스테로이드","연고","도포","오라메디","바르"], label:"국소 스테로이드 연고 도포", score:2},
    {kw:["가글","마취","함수","구강세정"], label:"국소 마취제/가글 대증요법", score:2},
    {kw:["자극","매운","신","음식 피","자극적"], label:"자극적인 음식 회피", score:2},
    {kw:["스트레스","피로","생활","관리","휴식"], label:"스트레스·생활관리", score:2},
    {kw:["베체트","혈액","전신질환","검사"], label:"심할 경우 베체트병 감별 혈액검사", score:2}
  ]},
  skills:[]
},
/* 3. HSV 재발성 구내 단순포진 (진료) */
{
  key:"hsv", type:"진료", name:"김철수 (만 26세, 남성)",

/* ===================== 상태 ===================== */
let CASE=null, asked={}, skillChecked={}, askTotal=0;

function norm(s){ return (s||"").toLowerCase().replace(/[\s.,?!~]/g,""); }
function matchQuestion(text){
  const t=norm(text); let best=null,bs=0;
  for(const q of CASE.questions){ let sc=0; for(const k of q.kw){ if(t.includes(norm(k)))sc++; } if(sc>bs){bs=sc;best=q;} }
  return bs>0?best:null;
}
function addMsg(text,who){
  const c=document.getElementById('chat'); const d=document.createElement('div');
  d.className='msg '+who; d.innerHTML='<div class="b">'+text+'</div>';
  c.appendChild(d); c.scrollTop=c.scrollHeight;
}
function speak(text){ try{ const u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=1.0; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
function handleQuestion(text){
  if(!text.trim())return;
  addMsg(text,'s'); askTotal++; document.getElementById('askCount').textContent='(질문 '+askTotal+'회)';
  const q=matchQuestion(text);
  if(q){ addMsg(q.ans,'p'); speak(q.ans); asked[q.id]=true; }
  else{ const fb="잘 모르겠어요. 다시 여쭤봐 주시겠어요?"; addMsg(fb,'p'); speak(fb); }
}
function askText(){ const i=document.getElementById('qInput'); handleQuestion(i.value); i.value=''; }

let recog=null,micOn=false;
function initRecog(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR)return null;
  const r=new SR(); r.lang='ko-KR'; r.interimResults=false; r.maxAlternatives=1;
  r.onresult=e=>handleQuestion(e.results[0][0].transcript);
  r.onend=()=>{micOn=false;document.getElementById('micBtn').classList.remove('on');};
  r.onerror=()=>{micOn=false;document.getElementById('micBtn').classList.remove('on');};
  return r;
}
function toggleMic(){
  if(!recog)recog=initRecog();
  if(!recog){alert('이 브라우저는 음성인식을 지원하지 않습니다. Chrome 브라우저를 권장합니다.');return;}
  const b=document.getElementById('micBtn');
  if(micOn){recog.stop();micOn=false;b.classList.remove('on');}
  else{try{recog.start();micOn=true;b.classList.add('on');}catch(e){}}
}

function hasSkills(){ return CASE.skills && CASE.skills.length>0; }
function renderCaseHeader(){
  document.getElementById('caseType').textContent=CASE.type+' 문항';
  document.getElementById('ptName').textContent=CASE.name;
  document.getElementById('ptCC').textContent=CASE.cc;
  document.getElementById('caseGuide').textContent=CASE.guide;
  document.getElementById('examTitle').textContent=CASE.examTitle;
  const t=document.getElementById('examTable'); t.innerHTML='<tr><th>검사</th><th>결과</th></tr>';
  for(const [k,v] of CASE.exam){ t.innerHTML+='<tr><td>'+k+'</td><td>'+v+'</td></tr>'; }
  // 수기 탭 노출 제어
  document.getElementById('tab3').classList.toggle('hidden',!hasSkills());
  document.getElementById('dxNext').textContent = hasSkills()?'저장 → 수기 ▶':'저장 → 채점 ▶';
}
function renderSkills(){
  const el=document.getElementById('skillList'); el.innerHTML='';
  CASE.skills.forEach((s,i)=>{
    const d=document.createElement('div'); d.className='chk';
    d.innerHTML='<input type="checkbox" id="sk'+i+'" onchange="skillChecked['+i+']=this.checked"> <label for="sk'+i+'">'+s.label+'</label>';
    el.appendChild(d);
  });
}
function afterDx(){ goStage(hasSkills()?3:4); }
function goStage(n){
  if(n===3 && !hasSkills()) n=4;
  document.querySelectorAll('.stage').forEach((s,i)=>s.classList.toggle('active',i===n));
  for(let i=0;i<5;i++){ document.getElementById('tab'+i).classList.toggle('cur',i===n); }
  if(n===4)grade();
}
function grade(){
  let total=0,max=0; const sections=[];
  let hxGot=0,hxMax=0;
  for(const q of CASE.questions){ hxMax+=q.score; if(asked[q.id])hxGot+=q.score; }
  sections.push(["문진(병력청취)",hxGot,hxMax]); total+=hxGot; max+=hxMax;
  const dx=norm(document.getElementById('dxInput').value);
  let dxGot=0; const dxHit=CASE.diagnosis.keywords.filter(k=>dx.includes(norm(k))).length;
  if(dxHit>=2)dxGot=CASE.diagnosis.score; else if(dxHit===1)dxGot=Math.round(CASE.diagnosis.score/2);
  sections.push(["진단명",dxGot,CASE.diagnosis.score]); total+=dxGot; max+=CASE.diagnosis.score;
  const tx=norm(document.getElementById('txInput').value);
  let txGot=0,txMax=0; const txMiss=[];
  for(const g of CASE.treatment.groups){ txMax+=g.score; if(g.kw.some(k=>tx.includes(norm(k))))txGot+=g.score; else txMiss.push(g.label); }
  sections.push(["치료계획",txGot,txMax]); total+=txGot; max+=txMax;
  const skMiss=[];
  if(hasSkills()){
    let skGot=0,skMax=0;
    CASE.skills.forEach((s,i)=>{ skMax+=s.score; if(skillChecked[i])skGot+=s.score; else skMiss.push(s.label); });
    sections.push(["수기",skGot,skMax]); total+=skGot; max+=skMax;
    grade._dxGot=dxGot;
  }

  document.getElementById('totalScore').textContent=total;
  document.getElementById('maxScore').textContent=max;
  const pct=max?Math.round(total/max*100):0;
  let g=pct>=90?"🏆 우수 (Pass)":pct>=70?"✅ 양호 (Pass)":pct>=50?"⚠️ 보완 필요":"❌ 미흡";
  document.getElementById('grade').textContent=g+" ("+pct+"%)";

  const st=document.getElementById('sectionTable'); st.innerHTML='<tr><th>영역</th><th>점수</th></tr>';
  for(const [n,gt,mx] of sections){ st.innerHTML+='<tr><td>'+n+'</td><td>'+gt+' / '+mx+'</td></tr>'; }

  const hr=document.getElementById('hxResult'); hr.innerHTML='';
  for(const q of CASE.questions){
    const ok=!!asked[q.id]; const d=document.createElement('div'); d.className='chk';
    d.innerHTML='<span class="dot '+(ok?'ok':'')+'">'+(ok?'✓':'✗')+'</span>'+q.label;
    hr.appendChild(d);
  }
  const fb=document.getElementById('feedback'); let html='';
  const hxMiss=CASE.questions.filter(q=>!asked[q.id]).map(q=>q.label);
  if(hxMiss.length)html+='<p><b style="color:#ff9b9b">문진 누락:</b> '+hxMiss.join(', ')+'</p>';
  if(dxGot<CASE.diagnosis.score)html+='<p><b style="color:#ff9b9b">진단:</b> 정답 → '+CASE.diagnosis.answer+'</p>';
  if(txMiss.length)html+='<p><b style="color:#ff9b9b">치료 누락:</b> '+txMiss.join(', ')+'</p>';
  if(skMiss.length)html+='<p><b style="color:#ff9b9b">수기 누락:</b> '+skMiss.join(', ')+'</p>';
  if(!html)html='<p style="color:#27ae60">완벽합니다! 모든 핵심 항목을 수행했습니다. 👏</p>';
  fb.innerHTML=html;
}

let timeLeft=600,timerId=null;
function startTimer(){
  clearInterval(timerId); timeLeft=600;
  timerId=setInterval(()=>{
    timeLeft--; const m=String(Math.floor(timeLeft/60)).padStart(2,'0'); const s=String(timeLeft%60).padStart(2,'0');
    const t=document.getElementById('timer'); t.textContent=m+':'+s;
    if(timeLeft<=60)t.classList.add('warn');
    if(timeLeft<=0){ clearInterval(timerId); alert('시험 시간(10분)이 종료되었습니다. 채점 화면으로 이동합니다.'); goStage(4); }
  },1000);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function restart(){
  CASE=CASES[Math.floor(Math.random()*CASES.length)];   // 케이스 무작위 선택
  asked={}; skillChecked={}; askTotal=0;
  shuffle(CASE.questions);                                // 문진 순서 셔플
  document.getElementById('chat').innerHTML='';
  addMsg('표준환자 준비 완료. 마스크·글러브 착용 후 환자 확인과 자기소개부터 시작하세요. (접속·새 문제마다 케이스와 문진 순서가 무작위로 바뀝니다)','sys');
  document.getElementById('dxInput').value='';
  document.getElementById('txInput').value='';
  document.getElementById('qInput').value='';
  document.getElementById('askCount').textContent='';
  document.getElementById('timer').classList.remove('warn');
  renderCaseHeader(); renderSkills(); goStage(0); startTimer();
}
window.onload=restart;
</script>
